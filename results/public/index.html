<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Model Benchmark</title>
<style>body{font:16px system-ui;margin:24px;background:#111827;color:#e5e7eb}button,input,select{font:inherit;padding:8px;margin:4px}h1{font-size:26px}.row{display:flex;gap:16px;overflow:auto}.card{flex:0 0 440px;min-width:0;background:#1f2937;padding:16px;border-radius:12px}pre{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.9}iframe{border:0;background:white;height:600px;transform-origin:top left}.frame{overflow:auto}canvas{width:100%;height:340px;touch-action:none}img{max-width:100%;max-height:240px}.status{color:#fbbf24}small{color:#9ca3af}</style>
<h1>Model Benchmark</h1><p>固定入力から得た成果を、人の目で比較する。LP はスクリプトを実行しない静的プレビューです。</p><label>結果URL <input id="url" value="./" aria-label="結果URL"></label><button id="load">読み込む</button><label>ローカル結果フォルダ <input id="folder" type="file" webkitdirectory multiple></label><p id="notice" role="status"></p><details><summary>比較候補モデル（実行結果とは別）</summary><ul id="candidates"></ul></details><main id="main"></main>
<script type="importmap">{"imports":{"three":"./vendor/build/three.module.js","three/addons/":"./vendor/addons/"}}</script><script src="candidates.js"></script><script src="manifest.js"></script>
<script type="module">
const $=id=>document.getElementById(id);let files=null,base=new URL('./',location.href),cleanups=[];
const node=(tag,text)=>{const e=document.createElement(tag);if(text!==undefined)e.textContent=text;return e;};
function safe(p){if(typeof p!=='string'||p.includes('..')||p.includes('\\')||p.startsWith('/')||/^[a-z]+:/i.test(p))throw Error('Unsafe artifact path');return p;}
async function bytes(p){safe(p);if(files){const f=files.get(p);if(!f)throw Error('Missing '+p);return await f.arrayBuffer();}const r=await fetch(new URL(p,base));if(!r.ok)throw Error('HTTP '+r.status);return await r.arrayBuffer();}
async function text(p){return new TextDecoder().decode(await bytes(p));}
async function objectUrl(p,type){const u=URL.createObjectURL(new Blob([await bytes(p)],{type}));cleanups.push(()=>URL.revokeObjectURL(u));return u;}
function lp(html,width){const f=node('iframe');f.title='LP preview';f.setAttribute('sandbox','');f.referrerPolicy='no-referrer';f.style.width=width+'px';const policy="default-src 'none'; script-src 'none'; style-src 'unsafe-inline'; img-src data:; font-src data:; connect-src 'none'; frame-src 'none'; media-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'";const doc=new DOMParser().parseFromString(html,'text/html');doc.querySelectorAll('script,iframe,frame,object,embed,base,meta[http-equiv],link,a,area,form').forEach(e=>{if(e.matches('a,area,form')){e.removeAttribute('href');e.removeAttribute('action');e.removeAttribute('target');}else e.remove();});doc.querySelectorAll('*').forEach(e=>{for(const a of [...e.attributes])if(a.name.startsWith('on'))e.removeAttribute(a.name);});f.srcdoc='<!doctype html><meta http-equiv="Content-Security-Policy" content="'+policy+'">'+doc.documentElement.outerHTML;return f;}
async function glb(canvas,p){const THREE=await import('three');const {GLTFLoader}=await import('three/addons/loaders/GLTFLoader.js');const {OrbitControls}=await import('three/addons/controls/OrbitControls.js');const manager=new THREE.LoadingManager();manager.setURLModifier(u=>{if(!u.startsWith('blob:')&&!u.startsWith('data:'))throw Error('External GLB resources blocked');return u;});const loader=new GLTFLoader(manager),data=await bytes(p);const view=new DataView(data);if(view.getUint32(0,true)!==0x46546c67)throw Error('Invalid GLB');const json=JSON.parse(new TextDecoder().decode(new Uint8Array(data,20,view.getUint32(12,true))));if([...(json.buffers||[]),...(json.images||[])].some(x=>x.uri&&!x.uri.startsWith('data:')))throw Error('GLB must embed all resources');const asset=await loader.parseAsync(data,'');const renderer=new THREE.WebGLRenderer({canvas,antialias:true});renderer.setSize(408,340,false);const scene=new THREE.Scene();scene.background=new THREE.Color('#e2e8f0');scene.add(asset.scene,new THREE.HemisphereLight(0xffffff,0x555577,3));const sun=new THREE.DirectionalLight(0xffffff,3);sun.position.set(3,5,4);scene.add(sun);const box=new THREE.Box3().setFromObject(asset.scene),center=box.getCenter(new THREE.Vector3()),size=box.getSize(new THREE.Vector3()).length()||1;asset.scene.position.sub(center);const camera=new THREE.PerspectiveCamera(45,408/340,.001,size*100);camera.position.set(size*.7,size*.4,size*1.5);const controls=new OrbitControls(camera,canvas);controls.enableDamping=true;renderer.setAnimationLoop(()=>{controls.update();renderer.render(scene,camera);});cleanups.push(()=>{renderer.setAnimationLoop(null);controls.dispose();asset.scene.traverse(o=>{o.geometry?.dispose();for(const m of (Array.isArray(o.material)?o.material:[o.material]).filter(Boolean)){for(const v of Object.values(m))if(v?.isTexture)v.dispose();m.dispose();}});renderer.dispose();});}
async function render(data){cleanups.forEach(f=>f());cleanups=[];$('main').replaceChildren();if(data.version!==1||!Array.isArray(data.results))throw Error('Unknown manifest');const groups=Map.groupBy(data.results,r=>r.task);for(const [task,results] of groups){$('main').append(node('h2',results[0].taskLabel||task));const row=node('div');row.className='row';$('main').append(row);for(const r of results){const c=node('section');c.className='card';row.append(c);c.append(node('h3',r.modelLabel||r.model),node('small',r.createdAt+' · '+(typeof r.durationMs==='number'?r.durationMs+' ms':'生成時間未取得')));const status=node('p',r.status);status.className='status';c.append(status);if(r.reason)c.append(node('small',r.reason));if(r.status!=='success'&&!r.artifactRecoveredFromFinalText&&!r.artifactRecoveredFromModelFiles)continue;try{if(r.type==='writing'||r.type==='research')c.append(node('pre',await text(r.artifact)));else if(r.type==='lp'){const select=node('select');for(const [v,t]of [[1024,'PC 1024px'],[390,'スマホ 390px']]){const o=node('option',t);o.value=v;select.append(o);}const frame=node('div');frame.className='frame';const html=await text(r.artifact);const refresh=()=>frame.replaceChildren(lp(html,Number(select.value)));select.onchange=()=>{for(const other of row.querySelectorAll('select')){other.value=select.value;other.dispatchEvent(new Event('widthchange'));}};select.addEventListener('widthchange',refresh);c.append(select,frame);refresh();}else if(r.type==='model3d'){if(r.reference){const img=node('img');img.alt='参照画像';img.src=await objectUrl(r.reference,'image/'+r.reference.split('.').pop());c.append(img);}const canvas=node('canvas');c.append(canvas,node('small','ドラッグで回転・ホイールで拡大'));await glb(canvas,r.artifact);}}catch(e){c.append(node('p','表示エラー: '+e.message));}}}$('notice').textContent=data.results.length+' 件';}
$('load').onclick=async()=>{try{files=null;base=new URL($('url').value,location.href);if(!base.pathname.endsWith('/'))base=new URL(base.href+'/');await render(JSON.parse(await text('manifest.json')));}catch(e){$('notice').textContent=e.message;}};
$('folder').onchange=async e=>{try{const list=[...e.target.files],m=list.find(f=>f.webkitRelativePath.endsWith('/manifest.json'));if(!m)throw Error('public フォルダを選択してください');const prefix=m.webkitRelativePath.slice(0,-'manifest.json'.length);files=new Map(list.filter(f=>f.webkitRelativePath.startsWith(prefix)).map(f=>[f.webkitRelativePath.slice(prefix.length),f]));await render(JSON.parse(await m.text()));}catch(e){$('notice').textContent=e.message;}};
for(const candidate of window.CANDIDATES||[]) candidates.append(node('li',candidate.label+' — '+candidate.status));if(window.BENCHMARK)render(window.BENCHMARK).catch(e=>$('notice').textContent=e.message);
</script></html>
