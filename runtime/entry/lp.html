<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LPプレビュー</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#1b1e25;color:#e8ebf2;font:14px/1.6 "Noto Sans JP","BIZ UDPGothic","Yu Gothic UI",system-ui,sans-serif}
body{display:flex;flex-direction:column}
.bar{display:flex;align-items:center;flex-wrap:wrap;gap:10px 14px;padding:10px 16px;background:#11131a;border-bottom:1px solid #2a2e38}
.bar b{font-size:14px}
.bar small{color:#9aa3b5}
.lock{display:inline-flex;align-items:center;height:20px;padding:0 7px;border-radius:5px;background:#1f3b2f;color:#7fe0b0;font-weight:700;font-size:11.5px}
.sp{margin-left:auto}
.seg{display:inline-flex;padding:3px;border-radius:9px;background:#232733}
.seg button{font:inherit;font-size:12.5px;height:26px;padding:0 11px;border:0;border-radius:6px;background:none;color:#aab3c5;cursor:pointer}
.seg button[aria-pressed="true"]{background:#e8ebf2;color:#11131a;font-weight:700}
.stage{flex:1;min-height:0;display:flex;justify-content:center;overflow:auto;padding:0}
.stage.framed{padding:20px}
iframe{border:0;background:#fff;width:100%;height:100%;display:block}
.stage.framed iframe{border-radius:10px;box-shadow:0 20px 50px -20px rgba(0,0,0,.6)}
.msg{margin:auto;color:#9aa3b5}
</style>
</head>
<body>
<div class="bar"><span class="lock">sandbox</span><b id="title">LPプレビュー</b><small id="sub"></small><span class="sp"></span><div class="seg" id="width"></div><div class="seg" id="motion"></div></div>
<div class="stage" id="stage"><p class="msg" id="msg">読み込み中…</p></div>
<script src="../manifest.js"></script>
<script src="lp-frame.js"></script>
<script>
'use strict';
const id=decodeURIComponent(location.hash.slice(1)),stage=document.getElementById('stage'),msg=document.getElementById('msg');
const r=(window.BENCHMARK?.results||[]).find(x=>x.id===id&&x.type==='lp');
let html=null,animated=true,width='full';
function seg(el,options,value,onchange){for(const [v,t] of options){const b=document.createElement('button');b.type='button';b.textContent=t;b.dataset.v=v;b.onclick=()=>{for(const x of el.children)x.setAttribute('aria-pressed',String(x===b));onchange(v);};b.setAttribute('aria-pressed',String(v===value));el.append(b);}}
function navigated(){document.getElementById('sub').textContent='スクリプトがフレームの外へ移動しようとしたため、静止表示に切り替えました。';document.querySelector('#motion [data-v="off"]').click();}
function mount(){if(html==null)return;const f=window.LPFrame.create(html,animated,'LPプレビュー',navigated);stage.classList.toggle('framed',width!=='full');if(width!=='full')f.style.width=width+'px';stage.replaceChildren(f);}
seg(document.getElementById('width'),[['full','全幅'],['1024','PC 1024'],['390','スマホ 390']],'full',v=>{width=v;mount();});
seg(document.getElementById('motion'),[['on','動きあり'],['off','静止']],'on',v=>{animated=v==='on';mount();});
if(!r)msg.textContent='LPが見つかりません。結果ページから開き直してください。';
else{document.getElementById('title').textContent=r.taskLabel||r.task;document.getElementById('sub').textContent=r.model;document.title=(r.taskLabel||r.task)+' — LPプレビュー';window.loadEntryAsset('../',r.id).then(a=>{if(a.error)throw Error(a.error);html=a.html;mount();}).catch(e=>msg.textContent='表示エラー: '+e.message);}
</script>
</body>
</html>
