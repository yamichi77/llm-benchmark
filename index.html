<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ベンチマークの結果</title>
<style>
:root{
  --bg:#f3f4f7;--surface:#fff;--sunken:#eceef3;
  --ink:#151922;--ink-2:#454e60;--ink-3:#727b8d;
  --line:#e1e4ea;--line-2:#d0d5de;
  --accent:#3550d6;--accent-soft:#e8ecff;
  --ok:#11734d;--ok-soft:#dff3e9;
  --warn:#8f5300;--warn-soft:#fff0d6;
  --bad:#b42318;--bad-soft:#fde8e6;
  --sans:"Noto Sans JP","BIZ UDPGothic","Yu Gothic UI","Hiragino Sans",system-ui,sans-serif;
  --mono:"Cascadia Mono",Consolas,ui-monospace,monospace;
  --r:14px;
  --shadow:0 1px 2px rgba(21,25,34,.05),0 10px 30px -18px rgba(21,25,34,.25);
}
*{box-sizing:border-box}
html{background:var(--bg);scroll-behavior:smooth}
body{margin:0;font:15px/1.7 var(--sans);color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button,select{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{width:min(1200px,100% - 48px);margin:0 auto}
.mono{font-family:var(--mono)}
[hidden]{display:none!important}

/* header */
.top{position:sticky;top:0;z-index:20;background:rgba(243,244,247,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:16px;height:60px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;white-space:nowrap}
.brand .mark{width:22px;height:22px;border-radius:6px;background:conic-gradient(from 210deg,#3550d6,#7aa2ff,#35c39a,#3550d6)}
.brand .crumb{font-weight:400;color:var(--ink-3)}
.run{position:relative;display:flex;align-items:center;gap:10px;min-width:0;padding:5px 12px 5px 7px;border:1px solid var(--line-2);border-radius:999px;background:var(--surface);font-size:13.5px}
.run .av{flex:none;width:22px;height:22px;border-radius:50%;background:#6f42c1;color:#fff;display:grid;place-items:center;font-size:11px;font-weight:700}
.run b{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.run small{color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.run select{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}
.run .caret{color:var(--ink-3)}
.top-actions{margin-left:auto;display:flex;gap:8px}
.btn{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 14px;border-radius:9px;font-size:13.5px;font-weight:500;border:1px solid var(--line-2);background:var(--surface);white-space:nowrap;cursor:pointer}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.accent{background:var(--accent);border-color:var(--accent);color:#fff}
.btn .k{color:var(--ink-3);font-size:12px}
.btn.primary .k,.btn.accent .k{color:rgba(255,255,255,.75)}
.tabs{display:flex;gap:4px;height:44px;align-items:stretch;overflow-x:auto;scrollbar-width:none}
.tabs a{display:flex;align-items:center;gap:8px;padding:0 12px;font-size:14px;color:var(--ink-2);border-bottom:2px solid transparent;white-space:nowrap}
.tabs a.on{color:var(--ink);font-weight:700;border-color:var(--ink)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ok);flex:none}
.dot.warn{background:#e19a1d}.dot.bad{background:var(--bad)}

/* common */
.sec{padding:44px 0 8px;scroll-margin-top:96px}
.sec-head{display:flex;align-items:flex-end;flex-wrap:wrap;gap:16px 24px;margin-bottom:18px}
.eyebrow{margin:0 0 4px;font-size:12.5px;letter-spacing:.06em;color:var(--ink-3);font-weight:500}
h1{margin:0;font-size:30px;line-height:1.35;font-feature-settings:"palt"}
h2{margin:0;font-size:23px;line-height:1.4;font-feature-settings:"palt"}
h3{margin:0 0 10px;font-size:13px;color:var(--ink-3);font-weight:500;letter-spacing:.04em}
.tools{margin-left:auto;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:inline-flex;padding:3px;border-radius:10px;background:var(--sunken);border:1px solid var(--line)}
.seg button{height:28px;padding:0 12px;border-radius:7px;font-size:13px;color:var(--ink-2);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.trial{height:34px;padding:0 10px;border-radius:9px;border:1px solid var(--line-2);background:var(--surface);font-size:13px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.badge{display:inline-flex;align-items:center;gap:6px;min-height:24px;padding:0 9px;border-radius:999px;font-size:12px;font-weight:700}
.badge.ok{background:var(--ok-soft);color:var(--ok)}
.badge.warn{background:var(--warn-soft);color:var(--warn)}
.badge.bad{background:var(--bad-soft);color:var(--bad)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 11px;border-radius:8px;background:var(--surface);border:1px solid var(--line);font-size:13px;color:var(--ink-2)}
.chip b{color:var(--ink)}
.note{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:10px;background:var(--warn-soft);color:#5d3a05;font-size:13.5px;line-height:1.65}
.note.bad{background:var(--bad-soft);color:#7a1a12}
.note .i{flex:none;width:20px;height:20px;border-radius:50%;background:#e19a1d;color:#fff;display:grid;place-items:center;font-size:12px;font-weight:700;margin-top:1px}
.note.bad .i{background:var(--bad)}
.note small{display:block;margin-top:4px;opacity:.75;font-size:12px;overflow-wrap:anywhere}
.sec>.note{margin-bottom:14px}
.error{padding:14px 16px;border-radius:10px;background:var(--bad-soft);color:#7a1a12;font-size:13.5px}

/* overview */
.ov{padding-top:36px}
.ov-head{display:flex;align-items:flex-end;flex-wrap:wrap;gap:16px 24px;margin-bottom:22px}
.ov-head .sub{margin:6px 0 0;color:var(--ink-3);font-size:13px;overflow-wrap:anywhere}
.others{margin-left:auto;text-align:right}
.others .chips{justify-content:flex-end}
.others .chip{height:28px;font-size:12.5px;color:var(--ink-3);background:transparent;border-style:dashed}
.others .lbl{font-size:12px;color:var(--ink-3);margin-bottom:6px}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
.tcard{overflow:hidden;display:flex;flex-direction:column;transition:transform .15s,box-shadow .15s}
.tcard:hover{transform:translateY(-2px);box-shadow:0 1px 2px rgba(21,25,34,.05),0 18px 40px -20px rgba(21,25,34,.35)}
.thumb{height:168px;position:relative;overflow:hidden;border-bottom:1px solid var(--line);background:var(--sunken)}
.thumb img{width:100%;height:100%;object-fit:cover;object-position:top;display:block}
.thumb.th3d{background:#5f636a}
.thumb.th3d img{object-position:center 22%}
.thumb .kind{position:absolute;left:10px;top:10px;height:22px;padding:0 8px;border-radius:6px;background:rgba(255,255,255,.92);font-size:11.5px;font-weight:700;display:flex;align-items:center;color:var(--ink)}
.thumb.txt{background:var(--surface);padding:38px 18px 0;font-size:12px;line-height:1.85;color:var(--ink-2)}
.thumb.txt::after{content:"";position:absolute;inset:auto 0 0;height:70px;background:linear-gradient(transparent,#fff)}
.thumb.txt .t-h{font-weight:700;color:var(--ink);font-size:13px;margin-bottom:4px}
.thumb.txt .kind{background:var(--sunken)}
.thumb.empty{display:grid;place-items:center;color:var(--ink-3);font-size:13px}
.tbody{padding:14px 16px 16px;display:flex;flex-direction:column;gap:8px;flex:1}
.tbody .ttl{font-weight:700;font-size:15px;line-height:1.5}
.tbody .meta{display:flex;align-items:center;gap:8px;margin-top:auto;font-size:12.5px;color:var(--ink-3)}
.tbody .meta .sp{margin-left:auto;white-space:nowrap}

/* LP */
.lp-stage{display:grid;grid-template-columns:1fr 292px;gap:28px;align-items:start;padding:26px;border-radius:18px;background:linear-gradient(180deg,#e4e7ee,#d9dde6);border:1px solid var(--line)}
.lp-stage.only-pc{grid-template-columns:1fr}
.lp-stage.only-pc .phone{display:none}
.lp-stage.only-mobile{grid-template-columns:1fr;justify-items:center}
.lp-stage.only-mobile .browser{display:none}
.browser{margin:0;border-radius:12px;overflow:hidden;background:#fff;box-shadow:0 30px 60px -30px rgba(10,14,30,.45),0 0 0 1px rgba(10,14,30,.08);min-width:0}
.browser .bar{display:flex;align-items:center;gap:12px;height:40px;padding:0 14px;background:#f1f2f5;border-bottom:1px solid #e3e5ea}
.browser .lights{display:flex;gap:6px}
.browser .lights i{width:11px;height:11px;border-radius:50%;background:#d4d7de}
.browser .addr{flex:1;min-width:0;height:26px;border-radius:7px;background:#fff;border:1px solid #e1e3e8;display:flex;align-items:center;gap:8px;padding:0 10px;font-size:12px;color:var(--ink-3);white-space:nowrap;overflow:hidden}
.lock{display:inline-flex;align-items:center;height:18px;padding:0 6px;border-radius:5px;background:var(--ok-soft);color:var(--ok);font-weight:700;font-size:11px}
.pc-vp{position:relative;width:100%;height:600px;overflow:hidden;background:#fff}
.lp-stage.only-pc .pc-vp{height:720px}
.pc-vp iframe,.ph-vp iframe{border:0;transform-origin:0 0;position:absolute;left:0;top:0;background:#fff}
.phone{margin:0;padding:11px;border-radius:44px;background:#16181d;box-shadow:0 30px 60px -30px rgba(10,14,30,.5),inset 0 0 0 2px #2a2d35}
.ph-vp{position:relative;width:270px;height:584px;border-radius:34px;overflow:hidden;background:#fff}
.lp-foot{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:18px}
.lp-foot .card{padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.lp-foot h3{margin:0}
.rec{display:flex;gap:12px;align-items:flex-start}
.rec figure{margin:0;flex:1;min-width:0}
.rec figure.mob{flex:0 0 112px}
.rec video{display:block;width:100%;border-radius:9px;background:#0b0d12}
.rec figcaption{font-size:12px;color:var(--ink-3);margin-top:4px}
.dl{font-size:13px;color:var(--accent);font-weight:500}

/* 3D */
.m3d-grid{display:grid;grid-template-columns:1fr 340px;gap:20px;align-items:start}
.viewer{position:relative;height:clamp(520px,calc(100vh - 150px),720px);border-radius:18px;overflow:hidden;background:radial-gradient(90% 75% at 50% 38%,#4a5262 0%,#2a2f3a 55%,#191c23 100%);box-shadow:var(--shadow);display:flex}
.viewer.light{background:radial-gradient(90% 75% at 50% 38%,#ffffff 0%,#e9ecf2 60%,#d6dbe4 100%)}
.v-ref{flex:0 0 50%;background:#e4e4e4;display:none}
.v-ref img{width:100%;height:100%;object-fit:contain;display:block}
.viewer.compare .v-ref{display:block}
.v-canvas{position:relative;flex:1;min-width:0}
.v-canvas canvas{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab;touch-action:none}
.v-canvas canvas:active{cursor:grabbing}
.v-canvas .fallback{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.v-msg{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);color:rgba(255,255,255,.75);font-size:13px;text-align:center}
.viewer.light .v-msg{color:var(--ink-3)}
.v-top{position:absolute;left:16px;right:16px;top:16px;display:flex;align-items:center;flex-wrap:wrap;gap:8px;pointer-events:none}
.v-top>*{pointer-events:auto}
.glass{background:rgba(0,0,0,.38);backdrop-filter:blur(6px);color:rgba(255,255,255,.88)}
.viewer.light .glass{background:rgba(255,255,255,.75);color:var(--ink-2);box-shadow:0 0 0 1px rgba(0,0,0,.06)}
.v-hint{display:flex;align-items:center;height:30px;padding:0 12px;border-radius:9px;font-size:12.5px}
.v-tools{margin-left:auto;display:flex;padding:3px;gap:2px;border-radius:10px}
.v-tools button{height:28px;padding:0 11px;border-radius:7px;font-size:12.5px;color:inherit}
.v-tools button[aria-pressed="true"]{background:rgba(255,255,255,.95);color:var(--ink);font-weight:700}
.viewer.light .v-tools button[aria-pressed="true"]{background:var(--ink);color:#fff}
.v-views{position:absolute;left:16px;right:16px;bottom:16px;display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap;pointer-events:none}
.v-views>*{pointer-events:auto}
.v-views .lbl{font-size:12px;margin-right:2px;align-self:center;padding:2px 8px;border-radius:6px}
.vv{width:72px;border-radius:10px;overflow:hidden;background:#5f636a;outline:1px solid rgba(255,255,255,.14);padding:0}
.vv img{display:block;width:72px;height:66px;object-fit:cover;object-position:center 30%}
.vv span{display:block;text-align:center;font-size:11px;color:#fff;background:rgba(0,0,0,.5);padding:2px 0}
.vv[aria-pressed="true"]{outline:2px solid #fff}
.viewer.light .vv[aria-pressed="true"]{outline-color:var(--ink)}
.v-stat{margin-left:auto;display:flex;gap:6px}
.v-stat span{height:26px;display:flex;align-items:center;padding:0 9px;border-radius:7px;font-size:12px;font-family:var(--mono)}
.m3d-side{display:flex;flex-direction:column;gap:14px;min-width:0}
.m3d-side .card{padding:16px}
.ref img{display:block;width:100%;border-radius:9px;background:#e8e8e8}
.ref .row{display:flex;gap:8px;margin-top:10px}
.ref .row .btn{flex:1;justify-content:center;height:32px;font-size:12.5px}
.ref .btn[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
dl.kv{display:grid;grid-template-columns:auto 1fr;gap:7px 12px;margin:0;font-size:13.5px}
dl.kv dt{color:var(--ink-3);white-space:nowrap}
dl.kv dd{margin:0;text-align:right;font-weight:700;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.ops{display:flex;flex-direction:column;gap:9px;font-size:12.5px}
.op{display:grid;grid-template-columns:1fr auto;gap:4px 10px}
.op .bar{grid-column:1/-1;height:5px;border-radius:3px;background:var(--sunken);overflow:hidden}
.op .bar i{display:block;height:100%;background:var(--ok);border-radius:3px}
.op .bar i.bad{background:var(--bad)}
.op code{font-family:var(--mono);font-size:12px;color:var(--ink-2);overflow-wrap:anywhere}
.op b{font-variant-numeric:tabular-nums}

/* reading */
.read{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:28px;align-items:start}
.paper{padding:40px 56px 44px;background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);min-width:0}
.prose{max-width:41em;margin:0 auto;font-size:16.5px;line-height:2;letter-spacing:.02em;color:#20242e;overflow-wrap:anywhere}
.prose p{margin:0 0 1.25em;line-break:strict}
.prose h2,.prose h3,.prose h4{line-height:1.5;margin:1.6em 0 .7em;scroll-margin-top:110px}
.prose h2{font-size:21px;padding-left:14px;border-left:4px solid var(--accent)}
.prose h3{font-size:18px;color:var(--ink);letter-spacing:.02em}
.prose h4{font-size:16.5px;color:var(--ink)}
.prose>:first-child{margin-top:0}
.prose ul,.prose ol{margin:0 0 1.25em;padding-left:1.4em}
.prose li{margin:.2em 0}
.prose blockquote{margin:0 0 1.25em;padding:2px 0 2px 16px;border-left:3px solid var(--line-2);color:var(--ink-2)}
.prose pre{margin:0 0 1.25em;padding:14px 16px;border-radius:10px;background:#f4f6fa;border:1px solid var(--line);font:13.5px/1.7 var(--mono);white-space:pre-wrap;overflow-wrap:anywhere}
.prose code{font-family:var(--mono);font-size:.83em;padding:.12em .42em;border-radius:5px;background:#eef1f7;color:#2b3a67;border:1px solid #e0e5f0}
.prose pre code{padding:0;border:0;background:none;font-size:inherit;color:inherit}
.prose .para{scroll-margin-top:110px}
.prose .lead{display:inline-flex;align-items:center;height:22px;padding:0 8px;margin:0 0 6px;border-radius:6px;background:var(--accent-soft);color:var(--accent);font-size:12px;font-weight:700;letter-spacing:.04em}
.prose .para.caveat .lead{background:var(--warn-soft);color:var(--warn)}
.raw{max-width:none;margin:0;white-space:pre-wrap;font:14px/1.9 var(--mono);color:#20242e;overflow-wrap:anywhere}
.doc-head{max-width:41em;margin:0 auto 26px;padding-bottom:18px;border-bottom:1px solid var(--line);display:flex;align-items:center;flex-wrap:wrap;gap:6px 10px;font-size:13px;color:var(--ink-3)}
.doc-head .sp{margin-left:auto}
.rail{position:sticky;top:120px;display:flex;flex-direction:column;gap:14px}
.rail .card{padding:16px 18px}
.toc{list-style:none;margin:0;padding:0;font-size:13.5px}
.toc li{border-top:1px solid var(--line)}
.toc li:first-child{border-top:0}
.toc a{display:flex;gap:10px;padding:6px 0;color:var(--ink-2)}
.toc li:first-child a{padding-top:0}
.toc a:hover{color:var(--ink)}
.toc .n{color:var(--ink-3);font-variant-numeric:tabular-nums;width:1.4em;flex:none}
.files{display:flex;flex-wrap:wrap;gap:6px}
.files code{font-family:var(--mono);font-size:11.5px;padding:3px 7px;border-radius:6px;background:var(--sunken);color:var(--ink-2);overflow-wrap:anywhere}
.stat3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat3 div{padding:10px;border-radius:10px;background:var(--sunken)}
.stat3 b{display:block;font-size:18px;font-variant-numeric:tabular-nums;line-height:1.3}
.stat3 small{font-size:11.5px;color:var(--ink-3)}
.empty-card{padding:22px;display:flex;flex-direction:column;gap:12px}

/* footer */
.foot{margin-top:56px;padding:28px 0 64px;border-top:1px solid var(--line);color:var(--ink-3);font-size:13px;display:grid;grid-template-columns:1fr 1fr;gap:24px}
.foot h3{margin-bottom:8px}
.foot nav{display:flex;flex-wrap:wrap;gap:8px}
.foot p{margin:0 0 6px}
.foot code{font-family:var(--mono);font-size:12px;background:var(--sunken);padding:1px 6px;border-radius:5px;color:var(--ink-2)}

@media (max-width:1060px){
  .cards{grid-template-columns:repeat(2,1fr)}
  .lp-stage{grid-template-columns:1fr;justify-items:center}
  .lp-stage .browser{width:100%}
  .m3d-grid,.read{grid-template-columns:1fr}
  .rail{position:static}
  .lp-foot,.foot{grid-template-columns:1fr}
  .top-actions .btn:not(.primary){display:none}
}
@media (max-width:640px){
  .wrap{width:calc(100% - 32px)}
  .cards{grid-template-columns:1fr}
  .paper{padding:24px 18px}
  .run small,.brand .crumb,.top-actions{display:none}
  .viewer{height:520px}
  .pc-vp{height:420px}
}
</style>
</head>
<body>
<header class="top">
  <div class="wrap top-in">
    <div class="brand"><span class="mark"></span>Model Benchmark <span class="crumb">/ 結果</span></div>
    <label class="run" id="run" hidden><span class="av" id="run-av"></span><b id="run-label"></b><small id="run-sub"></small><span class="caret" id="run-caret" hidden>▾</span><select id="run-select" aria-label="表示するモデル"></select></label>
    <nav class="top-actions" id="top-actions"></nav>
  </div>
  <nav class="wrap tabs" id="tabs" aria-label="課題"></nav>
</header>
